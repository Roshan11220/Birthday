<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy 21st Birthday Laxmi 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  font-family: monospace;
  color: white;

  display: grid;
  place-items: center; /* PERFECT CENTER */
}

/* COUNTDOWN */
#countdown {
  font-size: 220px;
  font-weight: bold;
  color: #ff4da6;
  text-shadow: 0 0 25px #ff4da6;
}

/* MESSAGE */
#message {
  display: none;
}

/* CONTENT GROUP (IMPORTANT) */
.content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 45px;
  color: #ff4da6;
  margin: 0;
}

/* TEXT */
p {
  font-size: 18px;
  margin: 4px 0;
}

/* SLIDESHOW */
.slideshow {
  position: relative;
  width: 240px;
  height: 240px;
}

.slide {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 1s ease-in-out, transform 1s;
  box-shadow: 0 0 25px #ff4da6;
}

.slide.active {
  opacity: 1;
  transform: scale(1.05);
}

/* PETALS */
.petal {
  position: absolute;
  top: -50px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(360deg);
  }
}

/* HEARTS */
.heart {
  position: absolute;
  bottom: -20px;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* FIREWORK */
.firework {
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  to {
    transform: scale(20);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="countdown">3</div>

<div id="message">
  <div class="content">

    <h1>🎂 Happy 21st Birthday, Laxmi 🎂</h1>

    <div class="slideshow">
      <img src="photo1.jpg" class="slide active">
      <img src="photo2.jpg" class="slide">
      <img src="photo3.jpg" class="slide">
    </div>

    <p>You are my favorite person, Laxmi 💕</p>
    <p>Welcome to your 21st year ✨</p>
    <p>May your life be filled with happiness and love 💖</p>

  </div>
</div>

<script>
// COUNTDOWN
let count = 3;
const countdownEl = document.getElementById("countdown");
const messageEl = document.getElementById("message");

const timer = setInterval(() => {
  count--;

  if (count > 0) {
    countdownEl.innerText = count;
  } else if (count === 0) {
    countdownEl.innerText = "1";
  } else {
    clearInterval(timer);
    countdownEl.style.display = "none";
    messageEl.style.display = "block";
  }
}, 1000);

// SLIDESHOW
let slides = document.querySelectorAll(".slide");
let index = 0;

setInterval(() => {
  slides[index].classList.remove("active");
  index = (index + 1) % slides.length;
  slides[index].classList.add("active");
}, 2500);

// PETALS
function createPetal() {
  const p = document.createElement("div");
  p.className = "petal";
  p.innerText = "🌹";

  p.style.left = Math.random() * 100 + "vw";
  p.style.fontSize = (Math.random() * 20 + 20) + "px";
  p.style.animationDuration = (Math.random() * 3 + 2) + "s";

  document.body.appendChild(p);
  setTimeout(() => p.remove(), 5000);
}
setInterval(createPetal, 120);

// HEARTS
function createHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerText = "💖";

  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (Math.random() * 15 + 15) + "px";
  h.style.animationDuration = (Math.random() * 4 + 3) + "s";

  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}
setInterval(createHeart, 400);

// FIREWORK
function createFirework() {
  const f = document.createElement("div");
  f.className = "firework";

  f.style.left = Math.random() * 100 + "vw";
  f.style.top = Math.random() * 100 + "vh";

  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}
setInterval(createFirework, 800);
</script>

</body>
</html>
